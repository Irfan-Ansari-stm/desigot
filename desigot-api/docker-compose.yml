version: '3.9'

services:
  # ── API Server ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: production
    container_name: desigot-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_PRIMARY_URL: postgresql://desigot_app:desigot_secret@postgres:5432/desigot
      DATABASE_REPLICA_URL:  postgresql://desigot_app:desigot_secret@postgres:5432/desigot
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local_dev_access_secret_at_least_64_chars_long_replace_in_prod
      JWT_REFRESH_SECRET: local_dev_refresh_secret_at_least_64_chars_long_replace_in_prod
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      FRONTEND_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro         # Hot-reload in dev (use nodemon image for dev)
    networks:
      - desigot-net

  # ── Background Worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      target: production
    container_name: desigot-worker
    restart: unless-stopped
    command: ["node", "src/workers/index.js"]
    environment:
      NODE_ENV: development
      DATABASE_PRIMARY_URL: postgresql://desigot_app:desigot_secret@postgres:5432/desigot
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - desigot-net

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: desigot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: desigot
      POSTGRES_USER: desigot_app
      POSTGRES_PASSWORD: desigot_secret
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desigot_app -d desigot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - desigot-net

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: desigot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - desigot-net

  # ── PgAdmin (dev only) ────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: desigot-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@desigot.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - desigot-net
    profiles:
      - tools   # Only started with: docker compose --profile tools up

volumes:
  postgres_data:
  redis_data:

networks:
  desigot-net:
    driver: bridge
